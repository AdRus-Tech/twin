services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://twin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/twin
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-0}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-30}
      AI_JSON_MODE: ${AI_JSON_MODE:-1}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-}

volumes:
  postgres_data:
